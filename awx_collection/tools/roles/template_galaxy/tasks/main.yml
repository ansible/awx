---
- name: Sanity assertions, that some variables have a non-blank value
  assert:
    that:
      - collection_version is defined and collection_version | length > 0
      - collection_path is defined and collection_path | length > 0

- name: Set the collection version in the controller_api.py file
  replace:
    path: "{{ collection_path }}/plugins/module_utils/controller_api.py"
    regexp: '^    _COLLECTION_VERSION = "0.0.1-devel"'
    replace: '    _COLLECTION_VERSION = "{{ collection_version }}"'

- name: Set the collection version in galaxy.yml
  replace:
    path: "{{ collection_path }}/galaxy.yml"
    regexp: '^version: 0\.0\.1-devel$'
    replace: 'version: {{ collection_version }}'
