---
# Same-hosts overlap: every loop item appends "<job id> <host> <item> <epoch>" to a marker
# file on the execution node (connection local, so all jobs share it), then sleeps 1 s.
# Two jobs of one template whose markers interleave for a host ran their playbooks at once.
- hosts: all
  gather_facts: false
  connection: local
  vars:
    iterations: 240
    marker: /tmp/fp-overlap.log
  tasks:
    - name: tick with marker
      shell: echo "{{ awx_job_id | default(tower_job_id) }} {{ inventory_hostname }} {{ item }} $(date +%s.%N)" >> {{ marker }}; sleep 1
      loop: "{{ range(iterations | int) | list }}"
      changed_when: false
