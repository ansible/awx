name: Setup images for AWX
description: Builds new awx_devel image
inputs:
  github-token:
    description: GitHub Token for registry access
    required: true
  private-github-key:
    description: GitHub private key for private repositories
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve COMPOSE_TAG
      # Use the target branch so the cached devel image matches. In a merge
      # queue run github.base_ref is empty and github.ref_name is the
      # temporary gh-readonly-queue/<branch>/... ref, so fall back to
      # merge_group.base_ref (refs/heads/<branch>) and trim the prefix.
      # A COMPOSE_TAG already set by the caller is kept.
      shell: bash
      run: echo "COMPOSE_TAG=${COMPOSE_TAG:-${BASE_REF#refs/heads/}}" >> $GITHUB_ENV
      env:
        BASE_REF: ${{ github.event.merge_group.base_ref || github.base_ref || github.ref_name || 'devel' }}

    - name: Set lower case owner name
      shell: bash
      run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Log in to registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - uses: ./.github/actions/setup-ssh-agent
      with:
        ssh-private-key: ${{ inputs.private-github-key }}

    - name: Pre-pull latest devel image to warm cache
      shell: bash
      run: |
        DEV_DOCKER_TAG_BASE=ghcr.io/${OWNER_LC} \
        docker pull -q `make print-DEVEL_IMAGE_NAME`
      continue-on-error: true

    - name: Build image for current source checkout
      shell: bash
      run: |
        DEV_DOCKER_TAG_BASE=ghcr.io/${OWNER_LC} \
        make docker-compose-build
