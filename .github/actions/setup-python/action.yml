name: 'Setup Python from .github/python-version'
description: 'Set up the Python version declared in the repo .github/python-version file'
inputs:
  python-version:
    description: 'Override Python version (optional)'
    required: false
    default: ''
  working-directory:
    description: 'Repo root containing the .github/python-version file'
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Resolve python version
      shell: bash
      run: |
        if [ -n "${{ inputs.python-version }}" ]; then
          echo "py_version=${{ inputs.python-version }}" >> $GITHUB_ENV
        else
          echo "py_version=$(cat ${{ inputs.working-directory }}/.github/python-version)" >> $GITHUB_ENV
        fi
    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.py_version }}
