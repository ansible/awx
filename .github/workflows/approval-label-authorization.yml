name: Approval label authorization

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  approval-label-authorization:
    uses: ansible/actions/.github/workflows/approval-label-authorization.yml@1a563d2009e4d48e2f8282df746bb042b49193b7
    with:
      approval-label: breaking-change-approved
      app-client-id: ${{ vars.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_PRIVATE_KEY }}
