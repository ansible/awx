name: Approval label authorization

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  approval-label-authorization:
    if: github.event.label.name == 'breaking-change-approved'
    uses: ansible/actions/.github/workflows/approval-label-authorization.yml@3540239ad509e66f3c879318679113f4f7c2685c
    with:
      app-client-id: ${{ vars.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_PRIVATE_KEY }}
