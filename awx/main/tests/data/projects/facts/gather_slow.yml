---

- hosts: all
  vars:
    extra_value: ""
  gather_facts: false
  connection: local
  tasks:
    # - name: escape zipfile 2-second timestamp rounding window
    #   wait_for:
    #     timeout: 2
    - name: set a custom fact
      set_fact:
        foo: "bar{{ extra_value }}"
        bar:
          a:
            b:
              - "c"
              - "d"
        cacheable: true
    - name: sleep to create overlap window for concurrent job testing
      wait_for:
        timeout: 20
